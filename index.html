<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f4a">
  <meta name="description" content="Control de desplazamientos y pagos de gasolina. Funciona en el móvil y guarda los datos en el propio dispositivo.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gasolina">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b4f4a'/%3E%3Cpath d='M20 42V24h9a6 6 0 0 1 0 12h-5' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M38 24v18M38 24h8M38 33h7' fill='none' stroke='%235eead4' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>Gasolina · Control</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="app">
    <header class="barra">
      <div class="barra-texto">
        <p class="marca">Control Gasolina</p>
        <h1 id="titulo-vista">Resumen</h1>
      </div>
      <button type="button" class="boton-icono" id="btn-compartir" aria-label="Compartir resumen" title="Compartir resumen" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0-12 4 4m-4-4L8 7M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div id="aviso-guardado" class="aviso" role="alert" hidden></div>
    <div id="aviso-excel" class="aviso-excel" role="status" hidden></div>

    <main id="contenido" class="contenido"></main>
  </div>

  <nav class="nav" aria-label="Secciones">
    <div class="nav-interior">
      <button type="button" class="nav-boton" data-vista="resumen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9m5 11V4m5 16v-7m5 7V7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Resumen</span>
      </button>
      <button type="button" class="nav-boton" data-vista="km">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.1 6-10a6 6 0 1 0-12 0c0 4.9 6 10 6 10Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>Km</span>
      </button>
      <button type="button" class="nav-boton" data-vista="pagos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Zm0 0 2-4h12l2 4M9 13h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Pagos</span>
      </button>
      <button type="button" class="nav-boton" data-vista="ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.1-1.2L14.1 3h-4.2l-.4 2.7A7 7 0 0 0 7.4 7l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.1 1.2L10 21h4l.4-2.7a7 7 0 0 0 2.1-1.2l2.3 1 2-3.4-2-1.5c.1-.4.2-.8.2-1.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>Ajustes</span>
      </button>
    </div>
  </nav>

  <button type="button" class="fab" id="fab" aria-label="Añadir" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>

  <dialog id="hoja" class="hoja"></dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="datos.js"></script>
  <script src="app.js"></script>
</body>
</html>
